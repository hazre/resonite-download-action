name: Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Secrets are unavailable on pull requests from forks and from Dependabot,
      # so only run the real download when credentials are actually provided.
      - name: Check for Steam credentials
        id: creds
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
        run: |
          if [ -n "$STEAM_USERNAME" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Steam credentials are not available for this run; the download test is skipped."
          fi

      - name: Test Action
        id: download
        if: steps.creds.outputs.available == 'true'
        uses: ./
        with:
          steam-username: ${{ secrets.STEAM_USERNAME }}
          steam-password: ${{ secrets.STEAM_PASSWORD }}
          resonite-path: ./test-resonite
          branch: public

      - name: Display Results
        if: steps.creds.outputs.available == 'true'
        env:
          VERSION: ${{ steps.download.outputs.version }}
          BUILD_ID: ${{ steps.download.outputs.build-id }}
          MANIFEST_ID: ${{ steps.download.outputs.manifest-id }}
          CACHE_HIT: ${{ steps.download.outputs.cache-hit }}
        run: |
          echo "Version: $VERSION"
          echo "Build ID: $BUILD_ID"
          echo "Manifest ID: $MANIFEST_ID"
          echo "Cache Hit: $CACHE_HIT"
