name: "Update Version Tags"

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Target Tag (e.g., v1.2.3)"
        required: true
        type: string

jobs:
  update-tags:
    name: "Update Tags"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write

    steps:
      - name: "Update Tags"
        uses: cssnr/update-version-tags-action@dc7077eaec04b8fd61f7b7e6d4830564cfd12382 # v2.1.1
        with:
          tag: ${{ inputs.tag || github.ref_name }}
          tags: latest
